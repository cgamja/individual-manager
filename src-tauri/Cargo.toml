[package]
name = "penguin"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "penguin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-positioner = { version = "2.3.3", features = ["tray-icon"] }
tauri-plugin-store = "2.4.4"
tauri-plugin-notification = "2.3.3"
# TLS: 0.13에서 "rustls-tls"가 "rustls"로 개명됨 (rustls 백엔드 + OS 신뢰 저장소 검증)
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
# macOS Keychain 토큰 보관 (기본 feature = apple-native store)
keyring = "4"
# "오늘" 판정은 Rust가 소유한다 (KTD3) — 로컬 날짜 YYYY-MM-DD 생성 전용
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "time"] }
wiremock = "0.6"

