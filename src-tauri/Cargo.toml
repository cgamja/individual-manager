[package]
name = "penguin"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "penguin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
tauri-plugin-positioner = { version = "2.3.3", features = ["tray-icon"] }
tauri-plugin-store = "2.4.4"
tauri-plugin-notification = "2.3.3"
tauri-plugin-single-instance = "2"
serde_json = "1.0.151"

# v2.0에서 걷어낸 것 (앱이 서비스 API를 직접 부르지 않는다 — PRINCIPLE 1):
#   reqwest·keyring·chrono·tokio, dev의 wiremock
# serde_json은 되돌아왔다 — 설정 저장소(tauri-plugin-store)가 serde_json::Value로
# 오가고, 마릿수를 읽고-고쳐-쓰기 하려면 필요하다.

